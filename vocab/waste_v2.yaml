# Open-vocabulary prompts, v2 — designed backwards from the bins.
#
# The rule this file follows: **ask for a distinction only where it changes a
# routing decision.** Aluminium versus steel is not such a distinction — both
# go in the same bin in every shipped policy, and a MRF separates them
# downstream by magnet and eddy current without the camera's help. So v2 asks
# for "metal can" and stops there. Container glass versus tableware IS such a
# distinction, because a tumbler ruins a batch of container glass, so that
# split stays.
#
# That rule is the reason for every merge here. It stands on how waste is
# actually sorted, not on any measurement.
#
# ON THE EVIDENCE BEHIND THE WORDING. Some prompt wordings below were picked
# by looking at two images during early development: one conveyor photograph
# and one of household items on a carpet. Two images are enough to notice a
# prompt misfiring and nowhere near enough to conclude one works. Those
# wordings are marked `# provisional` where they appear.
#
# Nothing in this project is measured against those two images any more, and
# they are not training data — they never were. The measurements come from a
# held-out split of WaRP (docs/DATA_CARD.md). When MRF imagery is available,
# re-run `scripts/zeroshot_eval.py` against it: that is how a provisional
# wording stops being provisional, or gets replaced.
#
# Rebuild embeddings after editing:
#     python scripts/build_vocab_embeddings.py vocab/waste_v2.yaml

name: Waste v2
description: >-
  Waste classes drawn at the granularity that changes a bin decision: metals
  merged, fibre separated, film and foam named specifically.
model: yoloe-11s-seg.pt

classes:
  # Metal -- one class. Aluminium vs steel does not change any bin in any
  # shipped policy, and asking for the distinction was v1's largest error.
  - metal can
  - metal bottle cap

  # Plastic containers
  - plastic bottle
  - plastic bottle cap
  - plastic tub
  - plastic cup

  # Plastic film -- its own destination everywhere (a MRF "tangler").
  - plastic bag
  - plastic wrapper

  # NO foam class -- provisional, and the weakest call in this file.
  #
  # Foam is real, common in a waste stream, and routes differently from
  # everything near it (landfill, not recycling). There is a good argument
  # that it belongs here.
  #
  # It was dropped because "styrofoam" and every replacement tried -- "foam
  # cup or tray", "white foam packaging", "polystyrene foam block" -- fired on
  # a sheet of paper instead, sending recyclable paper to landfill. But the
  # reason they did is that NEITHER TEST IMAGE CONTAINED ANY FOAM: a prompt
  # with no referent attaches to the nearest plausible thing. That is evidence
  # about the test set, not about the prompt.
  #
  # So this is a hole, not a finding. The first MRF image containing foam
  # settles it -- until then a prompt that cannot be shown to work is still
  # worse than an honest gap, because the failure mode sends fibre to
  # landfill.

  # Glass -- container vs tableware IS a bin distinction (a tumbler ruins a
  # batch of container glass), so unlike the metals this split stays.
  #
  # provisional wording: "drinking glass" alone lost to "metal can" on ONE
  # transparent tumbler, in one photograph, on a carpet. "empty drinking
  # glass" won that one object back. One object is a hint, not a result --
  # and a MRF line has no tableware on it at all, so the case this wording
  # was tuned for may not arise in the target domain.
  - glass bottle
  - glass jar
  - empty drinking glass

  # Fibre. Three destinations hide in here, which is why it is not one class:
  # plain fibre is recyclable, a poly-lined cup is not, and a beverage carton
  # is -- but only at a mill equipped for the coating, so it is often its own
  # stream. A carton and a cup are both "lined paper" and go to different
  # places, so the vocabulary has to be able to say which is which.
  - cardboard box
  - sheet of paper
  - newspaper
  - paper cup
  - beverage carton

  # Organics
  - food waste
