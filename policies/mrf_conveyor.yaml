# Materials recovery facility (MRF) sorting-line policy
#
# The same detector, a different context, and therefore different rules.
#
# A household policy reasonably assumes a detected "cup" is a cup. On a
# recycling sorting line that assumption is wrong: QA on real conveyor
# imagery found that every "cup" and "bowl" the model reported was in fact a
# container -- a steel can, an aluminium can, a can lid, a yogurt tub. There
# is no tableware on a MRF line. This policy encodes that context.
#
# It also mirrors how a MRF actually sorts. The first pass separates the
# stream into containers, fibre and residue; the metal/plastic/glass split
# happens downstream by magnet, eddy current and optical sorter -- machinery
# that does not need the camera's help. So "Mixed Containers" is the honest
# destination, not a guess between aluminium and PP that the detector cannot
# support.
#
# Fitted against a small sample. Re-measure with `recyclevision.qa` before
# trusting it on a new line.

name: MRF Sorting Line
description: >-
  First-pass separation for a materials recovery facility: containers, fibre,
  organics and residue. Assumes an industrial waste stream, not a kitchen.
version: 1

default: ignore

bins:
  - key: containers
    name: Mixed Containers
    color: "#1E6FD9"
    description: >-
      Cans, tubs, bottles and jars that could not be told apart. Split
      downstream by magnet, eddy current and optical sorter.
    diverted: true

  # The three bins below are only reachable with a vocabulary that can name
  # materials. A COCO detector cannot separate them and falls back to
  # "Mixed Containers" above.
  - key: metal
    name: Metal
    color: "#C2410C"
    description: Ferrous and aluminium, recovered by magnet and eddy current.
    diverted: true

  - key: plastic
    name: Rigid Plastic
    color: "#7B4FD9"
    description: PET, HDPE and PP, separated by optical sorter.
    diverted: true

  - key: glass
    name: Container Glass
    color: "#0E7490"
    description: Bottles and jars. Not glassware.
    diverted: true

  - key: fibre
    name: Paper & Cardboard
    color: "#B4802A"
    description: Old corrugated cardboard and mixed paper.
    diverted: true

  - key: organics
    name: Organics
    color: "#2E9E5B"
    description: >-
      Food and plant matter. Divertible, but on a recycling line it is
      contamination -- it wets and spoils the fibre stream.
    diverted: true

  - key: residue
    name: Residue
    color: "#9CA3AF"
    description: Not recoverable on this line. Goes to disposal.
    diverted: false

rules:

  # ------------------------------------------------------------- containers
  #
  # COCO's container vocabulary is tableware, so its labels arrive systematically
  # wrong here. The mapping below is by *shape*, which is what the model can
  # actually see, rather than by the label's dictionary meaning.

  cup: &container
    bin: containers
    item: Container
    material: metal, plastic or glass
    handling: Empty. Downstream separation handles the material split.
    certainty: high
    rationale: >-
      On a sorting line a "cup"-shaped detection is a can or a tub, not
      tableware. Measured: every "cup" in the sample was a steel can, an
      aluminium can, or a drinking glass -- and the first two dominate.

  bowl: *container
  bottle: *container
  wine glass: *container
  vase: *container

  # --------------------------------------------------------------- fibre

  book: &fibre
    bin: fibre
    item: Paper
    material: paper
    handling: Keep dry. Wet fibre is downgraded or rejected.
    certainty: high

  # ------------------------------------------------------------- organics

  banana: &food
    bin: organics
    item: Food waste
    material: organic
    handling: Remove from the line -- it contaminates the fibre stream.
    certainty: high
    rationale: Divertible in principle, but pure contamination in a recycling stream.

  apple: *food
  orange: *food
  broccoli: *food
  carrot: *food
  sandwich: *food
  hot dog: *food
  pizza: *food
  donut: *food
  cake: *food
  potted plant: *food

  # -------------------------------------------------------------- residue

  fork: &residue
    bin: residue
    item: Small metal or plastic item
    material: mixed
    handling: Too small to sort; falls through the screens.
    certainty: low
    rationale: >-
      Below the size threshold the sorting machinery can catch. Recoverable in
      principle, unrecoverable on this line.

  knife: *residue
  spoon: *residue
  scissors: *residue
  toothbrush: *residue

  backpack: &tangler
    bin: residue
    item: Textile
    material: textile
    handling: Pull off the line by hand -- textiles wrap the screen shafts.
    certainty: high
    rationale: A "tangler". Textiles and film jam the disc screens and force a shutdown.

  handbag: *tangler
  suitcase: *tangler
  tie: *tangler
  umbrella: *tangler
  teddy bear: *tangler

  cell phone: &ewaste
    bin: residue
    item: Electronics
    material: mixed electronic
    handling: Pull off the line. Lithium batteries ignite when compacted.
    certainty: high
    rationale: A fire risk on the line, not a recoverable material in this stream.

  laptop: *ewaste
  keyboard: *ewaste
  mouse: *ewaste
  remote: *ewaste
  tv: *ewaste
  microwave: *ewaste
  toaster: *ewaste
  hair drier: *ewaste
  oven: *ewaste
  refrigerator: *ewaste
  clock: *ewaste

  # ==========================================================================
  # Open-vocabulary classes (vocab/waste_v1.yaml)
  #
  # With a vocabulary that can name materials directly, the first-pass split
  # stops being a guess. "Mixed Containers" existed above because COCO could
  # not tell aluminium from PP; these classes can, so the stream is separated
  # properly.
  # ==========================================================================

  aluminum drink can: &metal
    bin: metal
    item: Metal container
    material: metal
    handling: Recovered by magnet (ferrous) and eddy current (aluminium).
    certainty: high

  steel food can: *metal
  metal can lid: *metal

  metal bottle cap:
    bin: residue
    item: Metal cap
    material: metal
    handling: Falls through the screens as fines.
    certainty: low
    rationale: Valuable material, but below the size the line can catch.

  plastic bottle: &rigid_plastic
    bin: plastic
    item: Rigid plastic
    material: plastic
    handling: Separated by optical sorter into PET, HDPE and PP streams.
    certainty: high

  plastic tub: *rigid_plastic
  plastic cup: *rigid_plastic

  plastic bottle cap:
    bin: residue
    item: Plastic cap
    material: plastic
    handling: Recovered only while attached to its bottle.
    certainty: low
    rationale: Below the size threshold the screens can catch.

  glass bottle: &glass
    bin: glass
    item: Container glass
    material: glass
    handling: Broken glass is still recoverable in the glass stream.
    certainty: high

  glass jar: *glass

  drinking glass:
    bin: residue
    item: Glassware
    material: glass
    handling: Pull off the line -- it contaminates the container glass batch.
    certainty: high
    rationale: >-
      Tableware and tempered glass melt at a different temperature and ruin
      a batch of recycled container glass. Same material, wrong stream.

  cardboard box: &occ
    bin: fibre
    item: Cardboard
    material: paper
    handling: Keep dry. Wet fibre is downgraded or rejected.
    certainty: high

  newspaper: *occ
  paper cup:
    bin: residue
    item: Lined paper cup
    material: lined paper
    handling: Poly-lined; a standard fibre mill cannot pulp it.
    certainty: high

  # Not the same call as the cup above, though both are lined paper. A carton
  # is a thick, uniform poly-coat on a defined board grade, which hydrapulpers
  # at carton-capable mills separate routinely; a cup is a thin coat on mixed
  # stock and is not worth recovering. Certainty is low because the answer is
  # a property of the receiving mill, not of the item -- a facility without an
  # outlet sends these to residue, and this rule is what it edits.
  beverage carton:
    bin: fibre
    item: Beverage carton
    material: liquid paperboard
    handling: >-
      Keep dry and keep it out of the OCC bale if the mill will not take
      coated stock -- confirm the outlet before diverting.
    certainty: low
    rationale: >-
      Recoverable wherever a carton outlet exists, and residue where none
      does. The item does not decide this; the contract does.

  styrofoam:
    bin: residue
    item: Polystyrene foam
    material: expanded polystyrene
    handling: Shatters into fragments that contaminate every other stream.
    certainty: high

  food waste:
    bin: organics
    item: Food waste
    material: organic
    handling: Remove from the line -- it wets and spoils the fibre stream.
    certainty: high

  plastic bag: &tangler_film
    bin: residue
    item: Film plastic
    material: film plastic
    handling: Pull off by hand before it reaches the screens.
    certainty: high
    rationale: The classic MRF tangler -- film wraps the screen shafts and stops the line.

  plastic film wrapper: *tangler_film

  # --- vocab/waste_v2.yaml ---------------------------------------------------

  metal can:
    bin: metal
    item: Metal container
    material: metal
    handling: Recovered by magnet (ferrous) and eddy current (aluminium).
    certainty: high
    rationale: >-
      The line separates ferrous from aluminium mechanically, so the camera
      does not need to -- and asking it to only introduced error.

  plastic wrapper:
    bin: residue
    item: Film plastic
    material: film plastic
    handling: Pull off by hand before it reaches the screens.
    certainty: high
    rationale: The classic MRF tangler -- film wraps the screen shafts and stops the line.

  foam cup or tray:
    bin: residue
    item: Polystyrene foam
    material: expanded polystyrene
    handling: Shatters into fragments that contaminate every other stream.
    certainty: high

  sheet of paper:
    bin: fibre
    item: Paper
    material: paper
    handling: Keep dry. Wet fibre is downgraded or rejected.
    certainty: high

  paper: *occ

  empty drinking glass:
    bin: residue
    item: Drinking glass
    material: glass
    handling: Pull off the line -- it contaminates the container glass batch.
    certainty: high
    rationale: >-
      Not container glass. Tableware and tempered glass melt at a different
      temperature and will ruin a batch of recycled container glass.
