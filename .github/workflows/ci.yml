name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The test suite drives the pipeline through a stub detector, so it
      # needs neither torch nor model weights nor a network. Installing the
      # full runtime here would add several minutes and buy nothing.
      - name: Install test dependencies
        run: pip install pillow pyyaml pytest ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest
