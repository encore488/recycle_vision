[project]
name = "recyclevision"
version = "0.3.0"
description = "Tells you which bin each item belongs in, and why."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into rendering internals on purpose, to pin down the colour
# handling that the v0.2 BGR bug lived in.
"tests/*" = ["E501"]
