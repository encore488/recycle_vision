[project]
name = "recyclevision"
version = "0.3.0"
description = "Tells you which bin each item belongs in, and why."
# 3.9 is supported deliberately: it is what the maintainer's working
# environment runs, and the 3.10-only conveniences this codebase reached for
# (`zip(strict=)`) were doing nothing the surrounding code did not already do.
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
# Notebooks are for Colab, where `!pip` and `%cd` are the point. They are not
# Python and linting them as Python only produces noise.
extend-exclude = ["notebooks"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into rendering internals on purpose, to pin down the colour
# handling that the v0.2 BGR bug lived in.
"tests/*" = ["E501"]
